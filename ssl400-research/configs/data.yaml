# Accuracy-oriented SSL400 settings.
# Classes with fewer than 10 samples are excluded. Training every class
# (including 1-sample signs) dropped test accuracy from ~54% to ~25%.

raw_csv_root: "../Dataset - MP - CSV"
processed_dir: "data/processed"
inspected_dir: "data/inspected"

min_samples_per_class: 10
sequence_length: 64
use_z: true
visibility_threshold: 0.5
mask_low_visibility: true
mask_lower_body: false

train_ratio: 0.70
val_ratio: 0.15
test_ratio: 0.15
split_seed: 42
save_npz: true
