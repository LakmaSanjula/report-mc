# Accuracy recipe: same backbone as the ~54% run, plus mild augmentation only.
# Weighted sampling is off because it trades overall accuracy for rare classes.

model:
  in_channels: 3
  num_joints: 33
  num_classes: null
  channels: [64, 64, 128, 256]
  temporal_kernel: 9
  dropout: 0.5
  graph_strategy: spatial

train:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: cosine
  step_size: 30
  gamma: 0.1
  early_stopping_patience: 20
  num_workers: 0
  amp: false
  class_weights: false
  weighted_sampler: false
  label_smoothing: 0.0
  focal_gamma: 1.0       # mild focal loss for scarce classes; 0 = plain cross-entropy
  augment: true
  seed: 42
  device: auto

paths:
  checkpoint_dir: "checkpoints"
  results_dir: "results"
  plots_dir: "results/plots"
  experiment_name: "stgcn_lowres_seed42"
